# A smoke test: the same run as experiments.yaml on pilot_papers papers with 1 update.
# Everything that defines a run. run.py copies this file into the run directory as config.yaml.
# The model for each role is set in configs/models.yaml.
blog_url: https://facebookresearch.github.io/RAM/blogs/unslop/
# The completed run meta-blog-seed0 and its pilot pilot-meta-blog-attested are read-only evidence.
# The output directory must not exist yet, so set a new one before each run.
output: runs/pilot-meta-blog-v2-p3
split: pilot  # research uses the saved train and validation papers; pilot uses pilot_papers of them
dataset: data/examples.jsonl
seed: 0  # grading order and bootstrap sampling, not model decoding
iterations: 1
max_meta_prompt_words: 2000
failure_examples: 24
concurrency: 32
pilot_papers: 2  # a pilot trains on the first and validates on the rest
writer_attempts: 3  # drafts per section; a draft that is cut off or outside the length window is redrafted
proposal_attempts: 2  # tries per optimizer update before the current meta prompt carries over
copy_span_words: 12  # a run of this many words copied from a training paper counts as leakage
min_identifier_length: 5  # shorter paper IDs, titles or author names match by chance
bootstrap_replicates: 2000
bootstrap_interval: [0.025, 0.975]
reported_validation:
  initial_gap: -4.2
  peak_gap: 2.76
  first_positive_iteration: 4
  peak_iteration: 5
  initial_human: 3.4
  final_human: 5.0
  initial_model: 7.6
  final_model: 2.7
