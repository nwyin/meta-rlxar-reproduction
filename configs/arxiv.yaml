# The paper run: missing sections of arXiv papers (fetch_data.py).
# Everything that defines a run. run.py copies this file into the run directory as config.yaml.
blog_url: https://facebookresearch.github.io/RAM/blogs/unslop/
# The completed run meta-blog-seed0 and its pilot pilot-meta-blog-attested are read-only evidence.
# The output directory must not exist yet, so set a new one before each run.
output: runs/arxiv-small-20261007
sample_fraction: 0.1  # 10% of each active split, rounded to the nearest example
sample_seed: 20261007  # fixed independently of grading order
split: research  # research uses the saved train and validation sources; pilot (a dry run) uses pilot_sources of them
dataset: data/examples.jsonl
prompts: prompts/papers  # writer, rubric, judge and optimizer prompts for this dataset
seed: 0  # grading order, not model decoding
# Model, provider and decoding settings for each role. The blog used Muse as writer, rubric
# generator and judge, and Kimi as optimizer.
roles:
  writer:
    model: meta/muse-spark-1.3-contributor
    provider: meta
    temperature: 0.7
    reasoning: {effort: medium}
    max_tokens: 16384
  rubric:
    model: meta/muse-spark-1.3-contributor
    provider: meta
    temperature: 0.2
    reasoning: {effort: medium}
    max_tokens: 16384
  judge:
    model: meta/muse-spark-1.3-contributor
    provider: meta
    temperature: 0
    reasoning: {effort: medium}
    max_tokens: 16384
  optimizer:
    model: moonshotai/kimi-k2.6
    provider: siliconflow/fp8
    temperature: 0.7
    reasoning: {enabled: true}
    max_tokens: 16384
iterations: 7
max_meta_prompt_words: 2000
failure_examples: 24
concurrency: 8
pilot_sources: 2  # a dry run trains on the first and validates on the rest
length_revision_mode: edit_only  # same-model editing of the complete draft with a measured word limit
strict_length: true  # refuse to score an incomplete or out-of-window draft
writer_attempts: 8  # drafts per section; a draft that is cut off or outside the length window is redrafted
proposal_attempts: 2  # tries per optimizer update before the current meta prompt carries over
copy_span_words: 12  # a run of this many words copied from a training source counts as leakage
min_identifier_length: 5  # shorter source IDs, titles or author names match by chance
# How requests are sent and retried.
api_base: https://openrouter.ai/api/v1
max_sends: 6  # sends per request, the first included
retryable_status: [408, 429, 500, 502, 503, 504]
backoff_seconds: [2, 5, 15, 30, 60]  # wait after each failed send; needs max_sends - 1 entries
max_retry_after_seconds: 120  # cap on a Retry-After header
request_timeout_seconds: 600
connect_timeout_seconds: 30
lookup_timeout_seconds: 30  # OpenRouter generation cost lookups
# When a reply is incomplete, not valid JSON or fails a check.
format_repairs: 1  # extra tries, each with the error appended to the system prompt
max_repair_error_chars: 500  # how much of the error the retry sees
reported_validation:
  initial_gap: -4.2
  peak_gap: 2.76
  first_positive_iteration: 4
  peak_iteration: 5
  initial_human: 3.4
  final_human: 5.0
  initial_model: 7.6
  final_model: 2.7
