blog_url: https://facebookresearch.github.io/RAM/blogs/unslop/
output: runs/arxiv-case-feedback
sample_fraction: 0.1
sample_seed: 20262010
split: research
dataset: data/examples.jsonl
prompts: prompts/experiments/case-feedback/papers
seed: 0
roles:
  writer:
    model: meta/muse-spark-1.1
    provider: meta
    temperature: 0.7
    reasoning:
      effort: medium
    max_tokens: 16384
  rubric:
    model: meta/muse-spark-1.1
    provider: meta
    temperature: 0.2
    reasoning:
      effort: medium
    max_tokens: 16384
  judge:
    model: meta/muse-spark-1.1
    provider: meta
    temperature: 0
    reasoning:
      effort: medium
    max_tokens: 16384
  optimizer:
    model: moonshotai/kimi-k2.6
    provider: siliconflow/fp8
    temperature: 0.7
    reasoning:
      enabled: true
    max_tokens: 16384
  critic:
    model: meta/muse-spark-1.1
    provider: meta
    temperature: 0.2
    reasoning:
      effort: medium
    max_tokens: 8192
iterations: 7
max_meta_prompt_words: 2000
failure_examples: 10
concurrency: 8
pilot_sources: 2
writer_attempts: 8
proposal_attempts: 2
copy_span_words: 12
min_identifier_length: 5
api_base: https://openrouter.ai/api/v1
max_sends: 6
retryable_status:
- 408
- 429
- 500
- 502
- 503
- 504
backoff_seconds:
- 2
- 5
- 15
- 30
- 60
max_retry_after_seconds: 120
request_timeout_seconds: 600
connect_timeout_seconds: 30
lookup_timeout_seconds: 30
format_repairs: 1
max_repair_error_chars: 500
reported_validation:
  initial_gap: -4.2
  peak_gap: 2.76
  first_positive_iteration: 4
  peak_iteration: 5
  initial_human: 3.4
  final_human: 5.0
  initial_model: 7.6
  final_model: 2.7
train_only: false
feedback_policy: all_pairs_context
strict_length: true
length_revision_mode: edit_only
best_parent: true
balanced_feedback: false
proposal_plaintext: false
optimizer_history: true
proposal_rationale_first: false
contrastive_feedback: true
validation_policy: selected
