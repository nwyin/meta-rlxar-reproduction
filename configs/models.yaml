models:
  meta/muse-spark-1.3-contributor:
    provider: meta
    reasoning:
      effort: medium
    max_tokens: 16384
  meta/muse-spark-1.1:
    provider: meta
    reasoning:
      effort: medium
    max_tokens: 16384
  moonshotai/kimi-k2.6:
    provider: siliconflow/fp8
    reasoning:
      enabled: true
    max_tokens: 16384
  z-ai/glm-5.3-flash:
    provider: fireworks
    reasoning:
      effort: high
    max_tokens: 16384
  xiaomi/mimo-v2.6-pro:
    provider: xiaomi/fp8
    reasoning:
      enabled: true
    max_tokens: 16384
  xiaomi/mimo-v2.6-flash:
    provider: xiaomi/fp8
    reasoning:
      enabled: true
    max_tokens: 16384
  qwen/qwen3.8-flash:
    provider: alibaba
    reasoning:
      max_tokens: 4096  # thinking budget; unbounded, the judge spent ~8,800 reasoning tokens a grade
    max_tokens: 16384
# The judge is Qwen3.8 Flash, chosen for cost; the blog judged with Muse. cross_judge grades the
# validation sections again with Muse at P0 and the selected checkpoint, after the freeze.
roles:
  writer:
    model: meta/muse-spark-1.3-contributor
    temperature: 0.7
  rubric:
    model: meta/muse-spark-1.3-contributor
    temperature: 0.2
  optimizer:
    model: moonshotai/kimi-k2.6
    temperature: 0.7
  judge:
    model: meta/muse-spark-1.3-contributor
    temperature: 0
  cross_judge:
    model: xiaomi/mimo-v2.6-pro
    temperature: 0
