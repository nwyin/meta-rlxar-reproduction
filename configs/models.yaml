models:
  meta/muse-spark-1.1:
    provider: meta
    reasoning:
      effort: medium
    max_tokens: 16384
  moonshotai/kimi-k2.6:
    provider: siliconflow/fp8
    reasoning:
      enabled: true
    max_tokens: 16384
  qwen/qwen3.8-flash:
    provider: alibaba
    reasoning:
      enabled: true
    max_tokens: 16384
# The judge is Qwen3.8 Flash, chosen for cost; the blog judged with Muse. cross_judge grades the
# validation sections again with Muse at P0 and the selected checkpoint, after the freeze.
roles:
  writer:
    model: meta/muse-spark-1.1
    temperature: 0.7
  rubric:
    model: meta/muse-spark-1.1
    temperature: 0.2
  optimizer:
    model: moonshotai/kimi-k2.6
    temperature: 0.7
  judge:
    model: qwen/qwen3.8-flash
    temperature: 0
  cross_judge:
    model: meta/muse-spark-1.1
    temperature: 0
