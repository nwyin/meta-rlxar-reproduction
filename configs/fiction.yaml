# The fiction run: story continuations from Project Gutenberg novels (fetch_fiction.py).
# Everything that defines a run. run.py copies this file into the run directory as config.yaml.
# The model for each role is set in configs/models.yaml.
blog_url: https://facebookresearch.github.io/RAM/blogs/unslop/
# The output directory must not exist yet, so set a new one before each run.
output: runs/fiction-seed0
split: research  # research uses the saved train and validation sources; pilot uses pilot_sources of them
dataset: data/fiction/examples.jsonl
prompts: prompts/fiction  # writer, rubric, judge and optimizer prompts for this dataset
seed: 0  # grading order and bootstrap sampling, not model decoding
iterations: 4
max_meta_prompt_words: 2000
failure_examples: 24
concurrency: 32
pilot_sources: 2  # a pilot trains on the first and validates on the rest
writer_attempts: 3  # drafts per section; a draft that is cut off or outside the length window is redrafted
proposal_attempts: 2  # tries per optimizer update before the current meta prompt carries over
copy_span_words: 12  # a run of this many words copied from a training source counts as leakage
min_identifier_length: 5  # shorter source IDs, titles or author names match by chance
bootstrap_replicates: 2000
bootstrap_interval: [0.025, 0.975]
# How requests are sent and retried.
api_base: https://openrouter.ai/api/v1
max_sends: 6  # sends per request, the first included
retryable_status: [408, 429, 500, 502, 503, 504]
backoff_seconds: [2, 5, 15, 30, 60]  # wait after each failed send; needs max_sends - 1 entries
max_retry_after_seconds: 120  # cap on a Retry-After header
request_timeout_seconds: 600
connect_timeout_seconds: 30
lookup_timeout_seconds: 30  # OpenRouter generation cost lookups
# When a reply is incomplete, not valid JSON or fails a check.
format_repairs: 1  # extra tries, each with the error appended to the system prompt
max_repair_error_chars: 500  # how much of the error the retry sees
